<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Запись на тренировки</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #121417;
      --card: #1c2026;
      --card-elevated: #242932;
      --text: #f3f4f6;
      --hint: #9ca3af;
      --accent: #3b9eff;
      --accent-soft: #1a2d42;
      --accent-border: #2c4c6e;
      --amber: #fbbf24;
      --amber-bg: #2e230f;
      --amber-border: #785413;
      --green: #34d399;
      --green-bg: #102b22;
      --green-border: #1f5c47;
      --danger: #f87171;
      --danger-bg: #2f1719;
      --danger-border: #6b272c;
      --border: #2d333d;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 84px;
    }
    .header {
      background: var(--card);
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .header h1 { margin: 0; font-size: 17px; font-weight: 700; color: var(--text); }
    .badge-role {
      font-size: 11px;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      border: 1px solid var(--accent-border);
    }
    .container { max-width: 480px; margin: 0 auto; padding: 12px 14px; }
    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
    }
    .section-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--hint);
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin: 14px 0 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .days-strip {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .days-strip::-webkit-scrollbar { display: none; }
    .day-pill {
      min-width: 58px;
      padding: 10px 8px;
      border-radius: 12px;
      background: var(--card);
      border: 1px solid var(--border);
      text-align: center;
      cursor: pointer;
      flex-shrink: 0;
      color: var(--text);
    }
    .day-pill.active {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }
    .day-pill .dow { font-size: 11px; opacity: 0.8; }
    .day-pill .dom { font-size: 16px; font-weight: 700; margin-top: 2px; }

    .slots-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .slot {
      padding: 12px 6px;
      border-radius: 12px;
      background: var(--card);
      border: 1px solid var(--border);
      text-align: center;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      color: var(--text);
    }
    .slot.selected {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }
    .slot.split-open {
      background: var(--amber-bg);
      border: 1.5px solid var(--amber-border);
      color: var(--amber);
    }
    .slot.split-open.selected {
      background: var(--amber);
      color: #121417;
      border-color: var(--amber);
    }
    .slot.busy {
      background: #171a1f;
      color: #6b7280;
      border-color: #232830;
      cursor: not-allowed;
    }
    .slot-sub { display: block; font-size: 10px; font-weight: 500; margin-top: 2px; }

    .format-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
    .format-btn {
      padding: 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card-elevated);
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }
    .format-btn.active {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
    }

    .btn {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary { background: var(--accent); color: #ffffff; }
    .btn-danger-outline {
      background: var(--danger-bg);
      color: var(--danger);
      border: 1px solid var(--danger-border);
    }
    .btn-sm { padding: 7px 10px; font-size: 12px; border-radius: 8px; width: auto; }
    .btn-approve {
      background: var(--green-bg);
      color: var(--green);
      border: 1px solid var(--green-border);
    }
    .btn-del {
      background: var(--danger-bg);
      color: var(--danger);
      border: 1px solid var(--danger-border);
    }
    .btn-neutral {
      background: var(--card-elevated);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .booking-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }
    .booking-item:last-child { border-bottom: none; padding-bottom: 0; }
    .booking-item:first-child { padding-top: 0; }

    .coach-slot-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 8px;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--card);
      border-top: 1px solid var(--border);
      display: flex;
      z-index: 30;
    }
    .nav-btn {
      flex: 1;
      padding: 10px 4px;
      border: none;
      background: none;
      font-size: 12px;
      font-weight: 600;
      color: var(--hint);
      cursor: pointer;
    }
    .nav-btn.active { color: var(--accent); }

    .fixed-cta {
      position: fixed;
      bottom: 14px; left: 14px; right: 14px;
      max-width: 452px;
      margin: 0 auto;
      z-index: 25;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
    }
    .note-box {
      background: var(--card-elevated);
      color: var(--text);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 13px;
      margin-top: 6px;
      border-left: 3px solid var(--accent);
    }
    textarea, input[type="text"] {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card-elevated);
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      margin-top: 8px;
    }
    textarea::placeholder { color: var(--hint); }
    .loader { text-align: center; padding: 40px 16px; color: var(--hint); font-size: 14px; }
  </style>
</head>
<body>
  <div class="header">
    <h1 id="headerTitle">Тренировки</h1>
    <span class="badge-role" id="roleBadge">Загрузка...</span>
  </div>

  <div class="container" id="app">
    <div class="loader">Синхронизация расписания...</div>
  </div>

  <div id="ctaHolder"></div>
  <div id="navHolder"></div>

  <script>
    // =========================================================
    // НАСТРОЙКИ — ВСТАВЬ СВОИ ДАННЫЕ СЮДА ПЕРЕД ЗАГРУЗКОЙ НА GITHUB
    // =========================================================
    const CONFIG = {
      GAS_WEB_APP_URL: 'https://script.google.com/macros/s/AKfycbyVDtMghWAr9eDHMHWBnTPxGf_xQ9cU3iB6FCF3jFIwv7hDgcI9STbnhJwLrwLXdTZrpg/exec',
      COACH_TG_ID: '1457299337'
    };

    const SESSION_DURATION_MIN = 60; // Тренировка всегда ровно 60 минут
    const STEP_MIN = 30;             // Шаг выбора времени — 30 минут

    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      if (tg.setBackgroundColor) tg.setBackgroundColor('#121417');
      if (tg.setHeaderColor) tg.setHeaderColor('#1c2026');
    }

    const tgUser = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) || {
      id: CONFIG.COACH_TG_ID,
      first_name: 'Тренер',
      username: ''
    };

    function timeToMinutes(t) {
      const [h, m] = String(t || '00:00').split(':').map(Number);
      return (h || 0) * 60 + (m || 0);
    }

    function minutesToTime(mins) {
      const h = Math.floor(mins / 60);
      const m = mins % 60;
      return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
    }

    // Слоты с 07:30 с шагом 30 минут так, чтобы 60-минутная тренировка заканчивалась не позже 23:00
    function buildSlots(startTime = '07:30', closingTime = '23:00', durationMin = SESSION_DURATION_MIN, stepMin = STEP_MIN) {
      const start = timeToMinutes(startTime);
      const lastAllowedStart = timeToMinutes(closingTime) - durationMin;
      const list = [];
      for (let t = start; t <= lastAllowedStart; t += stepMin) {
        list.push(minutesToTime(t));
      }
      return list;
    }

    const SLOTS = buildSlots('07:30', '23:00', SESSION_DURATION_MIN, STEP_MIN);

    // Пересекаются ли два 60-минутных интервала [startA, startA + 60) и [startB, startB + 60)
    function intervalsOverlap(startTimeA, startTimeB, durationA = SESSION_DURATION_MIN, durationB = SESSION_DURATION_MIN) {
      const a1 = timeToMinutes(startTimeA);
      const a2 = a1 + durationA;
      const b1 = timeToMinutes(startTimeB);
      const b2 = b1 + durationB;
      return a1 < b2 && a2 > b1;
    }

    const state = {
      loading: true,
      errorMsg: '',
      isCoach: String(tgUser.id) === String(CONFIG.COACH_TG_ID),
      clientRecord: null,
      clients: [],
      bookings: [],
      journal: [],
      blockedSlots: [],
      days: buildDays(10),
      selectedDate: '',
      selectedTime: null,
      selectedFormat: 'solo',
      coachTab: 'schedule',
      activeClientJournalId: null
    };
    state.selectedDate = state.days[0].iso;

    function buildDays(count) {
      const dowNames = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
      const list = [];
      const now = new Date();
      for (let i = 0; i < count; i++) {
        const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + i);
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        list.push({
          iso: `${y}-${m}-${day}`,
          dow: i === 0 ? 'Сегодня' : dowNames[d.getDay()],
          dom: d.getDate()
        });
      }
      return list;
    }

    async function apiGet(signal) {
      const url = `${CONFIG.GAS_WEB_APP_URL}?action=init&tg_id=${encodeURIComponent(tgUser.id)}`;
      const res = await fetch(url, signal ? { signal } : undefined);
      return await res.json();
    }

    async function apiPost(payload) {
      const res = await fetch(CONFIG.GAS_WEB_APP_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      });
      return await res.json();
    }

    async function loadData() {
      state.loading = true;
      state.errorMsg = '';
      render();

      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 8000);

      try {
        const data = await apiGet(controller.signal);

        if (data && data.ok) {
          state.isCoach = Boolean(data.isCoach);
          state.clientRecord = data.client;
          state.clients = data.clients || [];
          state.bookings = data.bookings || [];
          state.journal = data.journal || [];
          state.blockedSlots = data.blockedSlots || [];

          if (!state.isCoach && !state.clientRecord) {
            const fullName = [tgUser.first_name, tgUser.last_name].filter(Boolean).join(' ') || 'Клиент';
            const reg = await apiPost({
              type: 'register_client',
              tg_id: tgUser.id,
              name: fullName,
              username: tgUser.username ? '@' + tgUser.username : ''
            });
            state.clientRecord = { tg_id: tgUser.id, name: fullName, status: reg.status || 'pending' };
          }
        } else {
          state.errorMsg = 'Сервер расписания вернул ошибку.';
        }
      } catch (e) {
        console.error('Ошибка загрузки:', e);
        state.errorMsg = e.name === 'AbortError'
          ? 'Сервер Google отвечает слишком долго (таймаут 8 сек).'
          : 'Не удалось связаться с сервером расписания.';
      } finally {
        clearTimeout(timer);
        state.loading = false;
        render();
      }
    }

    function hoursUntil(dateStr, timeStr) {
      const [y, m, d] = dateStr.split('-').map(Number);
      const [hh, mm] = String(timeStr).split(':').map(Number);
      const target = new Date(y, m - 1, d, hh || 0, mm || 0, 0);
      return (target.getTime() - Date.now()) / (1000 * 60 * 60);
    }

   function getOverlappingItems(dateStr, slotTime) {
  const overlappingBookings = state.bookings.filter(b =>
    b.date === dateStr &&
    b.status !== 'cancelled' &&
    intervalsOverlap(slotTime, b.time, SESSION_DURATION_MIN, Number(b.duration) || SESSION_DURATION_MIN)
  );

  const overlappingBlocks = state.blockedSlots.filter(s =>
    s.date === dateStr &&
    intervalsOverlap(slotTime, s.time, SESSION_DURATION_MIN, Number(s.duration) || SESSION_DURATION_MIN)
  );

  return { overlappingBookings, overlappingBlocks };
}

    function render() {
      const app = document.getElementById('app');
      const ctaHolder = document.getElementById('ctaHolder');
      const navHolder = document.getElementById('navHolder');
      const roleBadge = document.getElementById('roleBadge');

      ctaHolder.innerHTML = '';
      navHolder.innerHTML = '';

      if (state.loading) {
        app.innerHTML = `<div class="loader">Синхронизация расписания...</div>`;
        return;
      }

      if (state.errorMsg) {
        app.innerHTML = `
          <div class="card" style="text-align:center; padding:22px 16px;">
            <div style="font-weight:700; font-size:15px; color:var(--danger); margin-bottom:6px;">${state.errorMsg}</div>
            <div style="font-size:12px; color:var(--hint); margin-bottom:14px;">Проверь интернет-соединение или доступ к script.google.com</div>
            <button class="btn btn-primary" onclick="loadData()">Повторить</button>
          </div>
        `;
        return;
      }

      if (state.isCoach) {
        roleBadge.textContent = 'Тренер';
        renderCoach(app, navHolder);
      } else {
        roleBadge.textContent = 'Клиент';
        renderClient(app, ctaHolder);
      }
    }

    function renderClient(app, ctaHolder) {
      if (!state.clientRecord || state.clientRecord.status !== 'approved') {
        app.innerHTML = `
          <div class="card" style="text-align:center; padding:24px 16px;">
            <div style="font-size:32px; margin-bottom:8px;">⏳</div>
            <div style="font-weight:700; font-size:16px;">Заявка отправлена тренеру</div>
            <p style="font-size:13px; color:var(--hint); line-height:1.45;">
              Как только тренер подтвердит доступ, здесь откроется расписание для записи на тренировки.
            </p>
            <button class="btn btn-primary" onclick="loadData()">Обновить статус</button>
          </div>
        `;
        return;
      }

      const myBookings = state.bookings.filter(b => String(b.client_tg_id) === String(tgUser.id) && b.status !== 'cancelled');
      let html = '';

      if (myBookings.length > 0) {
        html += `<div class="section-title">Мои записи</div><div class="card">`;
        myBookings.forEach(b => {
          const left = hoursUntil(b.date, b.time);
          const canCancel = left >= 12;
          const endTime = minutesToTime(timeToMinutes(b.time) + SESSION_DURATION_MIN);
          html += `
            <div class="booking-item">
              <div>
                <div style="font-weight:700; font-size:14px;">${b.date} · ${b.time}–${endTime}</div>
                <div style="font-size:12px; color:var(--hint);">
                  ${b.format === 'split' ? '👥 Сплит-тренировка (60 мин)' : '👤 Персональная (60 мин)'}
                </div>
                ${!canCancel ? `<div style="font-size:11px; color:var(--danger); margin-top:2px;">Отмена недоступна (менее 12 ч)</div>` : ''}
              </div>
              ${canCancel
                ? `<button class="btn btn-danger-outline btn-sm" onclick="cancelBooking('${b.id}')">Отменить</button>`
                : `<span style="font-size:18px;">🔒</span>`
              }
            </div>
          `;
        });
        html += `</div>`;
      }

      html += `
        <div class="section-title">Выберите день</div>
        <div class="days-strip">
          ${state.days.map(d => `
            <div class="day-pill ${d.iso === state.selectedDate ? 'active' : ''}" onclick="selectDate('${d.iso}')">
              <div class="dow">${d.dow}</div>
              <div class="dom">${d.dom}</div>
            </div>
          `).join('')}
        </div>
        <div class="section-title">Свободное время (60 мин)</div>
        <div class="slots-grid">
      `;

      SLOTS.forEach(slotTime => {
        const { overlappingBookings, overlappingBlocks } = getOverlappingItems(state.selectedDate, slotTime);
        const exactBookings = overlappingBookings.filter(b => b.time === slotTime);
        const hasSolo = overlappingBookings.some(b => b.format !== 'split');
        const splitCount = overlappingBookings.filter(b => b.format === 'split').length;
        const alreadyMine = overlappingBookings.some(b => String(b.client_tg_id) === String(tgUser.id));

        const canJoinSplit = !alreadyMine && overlappingBlocks.length === 0 && !hasSolo && splitCount === 1 && exactBookings.length === 1;

        if (overlappingBlocks.length > 0 || hasSolo || splitCount >= 2 || alreadyMine || (splitCount === 1 && !canJoinSplit)) {
          html += `<div class="slot busy">${slotTime}<span class="slot-sub">${alreadyMine ? 'Вы записаны' : 'Занято'}</span></div>`;
        } else if (canJoinSplit) {
          const sel = state.selectedTime === slotTime ? 'selected' : '';
          html += `<div class="slot split-open ${sel}" onclick="selectSlot('${slotTime}', true)">${slotTime}<span class="slot-sub">👥 Сплит 1/2</span></div>`;
        } else {
          const sel = state.selectedTime === slotTime ? 'selected' : '';
          html += `<div class="slot ${sel}" onclick="selectSlot('${slotTime}', false)">${slotTime}<span class="slot-sub">Свободно</span></div>`;
        }
      });

      html += `</div>`;

      if (state.selectedTime) {
        const endTime = minutesToTime(timeToMinutes(state.selectedTime) + SESSION_DURATION_MIN);
        const { overlappingBookings } = getOverlappingItems(state.selectedDate, state.selectedTime);
        const isJoiningSplit = overlappingBookings.some(b => b.time === state.selectedTime && b.format === 'split');

        if (!isJoiningSplit) {
          html += `
            <div class="card" style="margin-top:12px;">
              <div style="font-size:13px; font-weight:700;">Формат тренировки в ${state.selectedTime}–${endTime} (60 мин)</div>
              <div class="format-row">
                <div class="format-btn ${state.selectedFormat === 'solo' ? 'active' : ''}" onclick="setFormat('solo')">👤 Персональная</div>
                <div class="format-btn ${state.selectedFormat === 'split' ? 'active' : ''}" onclick="setFormat('split')">👥 Сплит (оставить 1 место)</div>
              </div>
            </div>
          `;
        } else {
          html += `
            <div class="card" style="margin-top:12px; background:var(--amber-bg); border-color:var(--amber-border);">
              <div style="font-size:13px; font-weight:700; color:var(--amber);">👥 Присоединение к сплиту (2-е место)</div>
              <div style="font-size:12px; color:var(--hint); margin-top:2px;">Интервал ${state.selectedTime}–${endTime} будет закрыт после вашей записи.</div>
            </div>
          `;
        }

        ctaHolder.innerHTML = `
          <div class="fixed-cta">
            <button class="btn btn-primary" onclick="bookNow()">Записаться на ${state.selectedDate} · ${state.selectedTime}–${endTime}</button>
          </div>
        `;
      }

      app.innerHTML = html;
    }

    function renderCoach(app, navHolder) {
  navHolder.innerHTML = `
    <div class="bottom-nav">
      <button class="nav-btn ${state.coachTab === 'schedule' ? 'active' : ''}" onclick="setCoachTab('schedule')">📅 Расписание</button>
      <button class="nav-btn ${state.coachTab === 'clients' ? 'active' : ''}" onclick="setCoachTab('clients')">👥 Клиенты и журнал</button>
    </div>
  `;

  if (state.coachTab === 'schedule') {
    let html = `
      <div class="card" style="background:var(--accent-soft); border-color:var(--accent-border); padding:10px 12px;">
        <div style="font-size:12px; font-weight:700; color:var(--accent);">📅 Слоты 07:30–22:00 (шаг 30 мин, длительность 60 мин)</div>
        <div style="font-size:11px; color:var(--hint); margin-top:2px;">Тренировка длится 60 минут и перекрывает соседний 30-минутный старт.</div>
      </div>
      <div class="days-strip">
        ${state.days.map(d => `
          <div class="day-pill ${d.iso === state.selectedDate ? 'active' : ''}" onclick="selectDate('${d.iso}')">
            <div class="dow">${d.dow}</div>
            <div class="dom">${d.dom}</div>
          </div>
        `).join('')}
      </div>
      <div class="section-title">Слоты на ${state.selectedDate}</div>
    `;

    SLOTS.forEach(slotTime => {
      const slotStart = timeToMinutes(slotTime);
      const slotEnd = slotStart + SESSION_DURATION_MIN;
      const endTime = minutesToTime(slotEnd);
      const { overlappingBookings, overlappingBlocks } = getOverlappingItems(state.selectedDate, slotTime);

      const exactBookings = overlappingBookings.filter(b => b.time === slotTime);
      const exactBlock = overlappingBlocks.find(s => s.time === slotTime);

      if (exactBookings.length > 0) {
        const names = exactBookings.map(b => `${b.client_name} (${b.format === 'split' ? 'Сплит' : 'Перс.'})`).join(', ');
        html += `
          <div class="coach-slot-row" style="border-left:4px solid var(--accent);">
            <div>
              <div style="font-weight:700; font-size:14px;">${slotTime}–${endTime} — ${names}</div>
              <div style="font-size:11px; color:var(--hint);">Записано: ${exactBookings.length} чел.</div>
            </div>
            <button class="btn btn-del btn-sm" onclick="cancelBooking('${exactBookings[0].id}', true)">Отменить</button>
          </div>
        `;
      } else if (overlappingBookings.length > 0) {
        const parentBooking = overlappingBookings[0];
        html += `
          <div class="coach-slot-row" style="background:var(--card-elevated); opacity:0.85;">
            <div>
              <div style="font-weight:600; font-size:14px; color:var(--hint);">${slotTime}–${endTime} — Перекрыто (${parentBooking.client_name} с ${parentBooking.time})</div>
              <div style="font-size:11px; color:var(--hint);">Старт в ${slotTime} недоступен из-за 60-минутной записи</div>
            </div>
          </div>
        `;
      } else if (exactBlock) {
        const isGcal = exactBlock.source === 'gcal';
        const bEnd = minutesToTime(timeToMinutes(exactBlock.time) + (Number(exactBlock.duration) || SESSION_DURATION_MIN));
        html += `
          <div class="coach-slot-row" style="background:var(--card-elevated);">
            <div>
              <div style="font-weight:700; font-size:14px; color:var(--hint);">${slotTime}–${endTime} — 🔒 ${exactBlock.reason || 'Закрыто'} (${exactBlock.time}–${bEnd})</div>
              <div style="font-size:11px; color:var(--hint);">${isGcal ? 'Из Google Календаря' : 'Закрыто вручную'}</div>
            </div>
            ${!isGcal ? `<button class="btn btn-approve btn-sm" onclick="toggleBlock('${slotTime}')">Открыть</button>` : ''}
          </div>
        `;
      } else if (overlappingBlocks.length > 0) {
        const parentBlock = overlappingBlocks[0];
        const isGcal = parentBlock.source === 'gcal';
        html += `
          <div class="coach-slot-row" style="background:var(--card-elevated); opacity:0.85;">
            <div>
              <div style="font-weight:600; font-size:14px; color:var(--hint);">${slotTime}–${endTime} — Перекрыто (${parentBlock.reason || 'Занято'} с ${parentBlock.time})</div>
              <div style="font-size:11px; color:var(--hint);">${isGcal ? 'Из Google Календаря' : 'Перекрыто соседним слотом'}</div>
            </div>
          </div>
        `;
      } else {
        html += `
          <div class="coach-slot-row">
            <div style="font-weight:700; font-size:14px;">${slotTime}–${endTime} — <span style="color:var(--green); font-weight:500;">Свободно</span></div>
            <button class="btn btn-neutral btn-sm" onclick="toggleBlock('${slotTime}')">🔒 Личное время</button>
          </div>
        `;
      }
    });

    app.innerHTML = html;
  } else {
    const pending = state.clients.filter(c => c.status === 'pending');
    const approved = state.clients.filter(c => c.status === 'approved');
    let html = '';

    if (pending.length > 0) {
      html += `<div class="section-title">Ожидают одобрения (${pending.length})</div>`;
      pending.forEach(c => {
        html += `
          <div class="card" style="border-color:var(--amber-border); background:var(--amber-bg);">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <div>
                <div style="font-weight:700;">${c.name}</div>
                <div style="font-size:12px; color:var(--hint);">${c.username || 'ID: ' + c.tg_id}</div>
              </div>
              <div style="display:flex; gap:6px;">
                <button class="btn btn-approve btn-sm" onclick="moderateClient('${c.tg_id}', 'approve')">✓ Одобрить</button>
                <button class="btn btn-del btn-sm" onclick="moderateClient('${c.tg_id}', 'delete')">✕</button>
              </div>
            </div>
          </div>
        `;
      });
    }

    html += `<div class="section-title">Активные клиенты (${approved.length})</div>`;
    if (approved.length === 0) {
      html += `<div class="card" style="color:var(--hint); font-size:13px;">Пока нет одобренных клиентов.</div>`;
    }

    approved.forEach(c => {
      const clientNotes = state.journal.filter(j => String(j.client_tg_id) === String(c.tg_id));
      const isOpen = String(state.activeClientJournalId) === String(c.tg_id);

      html += `
        <div class="card">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <div>
              <div style="font-weight:700; font-size:15px;">${c.name}</div>
              <div style="font-size:12px; color:var(--hint);">Посещений: <b>${c.visits || 0}</b> · ${c.username || ''}</div>
            </div>
            <div style="display:flex; gap:6px;">
              <button class="btn btn-sm" style="background:var(--accent-soft); color:var(--accent); border:1px solid var(--accent-border);" onclick="toggleJournal('${c.tg_id}')">📓 Журнал</button>
              <button class="btn btn-del btn-sm" onclick="moderateClient('${c.tg_id}', 'delete')">🗑</button>
            </div>
          </div>
          ${isOpen ? `
            <div style="margin-top:12px; padding-top:10px; border-top:1px solid var(--border);">
              <div style="font-size:12px; font-weight:700; color:var(--hint);">Заметки тренера (клиент не видит):</div>
              ${clientNotes.length === 0 ? `<div style="font-size:12px; color:var(--hint); margin-top:4px;">Записей пока нет</div>` : ''}
              ${clientNotes.map(n => `<div class="note-box"><b>${n.date}:</b> ${n.note}</div>`).join('')}
              <textarea id="note_${c.tg_id}" rows="2" placeholder="Что делали на тренировке, акценты..."></textarea>
              <button class="btn btn-primary btn-sm" style="margin-top:6px;" onclick="saveNote('${c.tg_id}', '${String(c.name || '').replace(/'/g, '')}')">Сохранить заметку</button>
            </div>
          ` : ''}
        </div>
      `;
    });

    app.innerHTML = html;
  }
}

    function selectDate(iso) { state.selectedDate = iso; state.selectedTime = null; render(); }
    function selectSlot(time, forceSplit) {
      state.selectedTime = time;
      if (forceSplit) state.selectedFormat = 'split';
      render();
    }
    function setFormat(fmt) { state.selectedFormat = fmt; render(); }
    function setCoachTab(tab) { state.coachTab = tab; render(); }
    function toggleJournal(id) {
      state.activeClientJournalId = String(state.activeClientJournalId) === String(id) ? null : id;
      render();
    }

    async function bookNow() {
      const fullName = [tgUser.first_name, tgUser.last_name].filter(Boolean).join(' ') || 'Клиент';
      state.loading = true; render();
      await apiPost({
        type: 'create_booking',
        date: state.selectedDate,
        time: state.selectedTime,
        duration: SESSION_DURATION_MIN,
        format: state.selectedFormat,
        client_tg_id: tgUser.id,
        client_name: fullName
      });
      state.selectedTime = null;
      await loadData();
    }

    async function cancelBooking(bookingId, forceByCoach = false) {
      state.loading = true; render();
      await apiPost({ type: 'cancel_booking', booking_id: bookingId, force_by_coach: forceByCoach });
      await loadData();
    }

    async function toggleBlock(time) {
      state.loading = true; render();
      await apiPost({
        type: 'toggle_block_slot',
        date: state.selectedDate,
        time: time,
        duration: SESSION_DURATION_MIN,
        reason: 'Личные дела'
      });
      await loadData();
    }

    async function moderateClient(targetId, decision) {
      state.loading = true; render();
      await apiPost({ type: 'moderate_client', target_tg_id: targetId, decision: decision });
      await loadData();
    }

    async function saveNote(clientId, clientName) {
      const el = document.getElementById('note_' + clientId);
      const text = el && el.value.trim();
      if (!text) return;
      state.loading = true; render();
      await apiPost({ type: 'add_journal_note', client_tg_id: clientId, client_name: clientName, note: text });
      await loadData();
    }

    loadData();
  </script>
</body>
</html>
